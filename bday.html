<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Happy Birthday Hon</title>
  
  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@600;700&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
  
  <!-- External Libraries -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
  
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }

    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: 'Poppins', sans-serif;
      background: #0d0614;
      color: #fff;
    }

    /* Screen Base */
    .screen {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      z-index: 10;
    }

    /* ----------------------------------------------------
       QUESTION SCREEN
    ---------------------------------------------------- */
    #question-screen {
      background: radial-gradient(circle at center, #2c1236 0%, #0d0614 100%);
    }

    .card {
      background: rgba(255, 255, 255, 0.05);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      padding: 3rem 2.5rem;
      border-radius: 24px;
      text-align: center;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
      max-width: 450px;
      width: 90%;
      position: relative;
    }

    .card h1 {
      font-family: 'Dancing Script', cursive;
      font-size: 3rem;
      color: #ff6584;
      margin-bottom: 1rem;
      text-shadow: 0 0 10px rgba(255, 101, 132, 0.3);
    }

    .card p {
      font-size: 1.1rem;
      color: #e0e0e0;
      margin-bottom: 2.5rem;
    }

    .button-group {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 20px;
      position: relative;
      min-height: 60px;
    }

    .btn {
      padding: 14px 32px;
      font-size: 1.1rem;
      font-weight: 600;
      border: none;
      border-radius: 50px;
      cursor: pointer;
      transition: transform 0.2s, box-shadow 0.2s;
      outline: none;
    }

    .btn-yes {
      background: linear-gradient(135deg, #ff416c, #ff4b2b);
      color: white;
      box-shadow: 0 4px 15px rgba(255, 65, 108, 0.4);
      z-index: 2;
    }

    .btn-yes:hover {
      transform: scale(1.08);
      box-shadow: 0 6px 20px rgba(255, 65, 108, 0.6);
    }

    .btn-no {
      background: rgba(255, 255, 255, 0.15);
      color: #ddd;
      backdrop-filter: blur(5px);
      position: absolute;
      right: 20px;
    }

    /* ----------------------------------------------------
       CLIMAX SCREEN & CANVAS
    ---------------------------------------------------- */
    #climax-screen {
      opacity: 0;
      pointer-events: none;
      transition: opacity 1s ease;
    }

    #climax-screen.active {
      opacity: 1;
      pointer-events: auto;
    }

    #canvas-3d {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
    }

    /* Ambient Floating HTML Particles */
    .html-particle {
      position: absolute;
      pointer-events: none;
      z-index: 2;
      opacity: 0.6;
      animation: floatUp linear infinite;
    }

    @keyframes floatUp {
      0% {
        transform: translateY(100vh) rotate(0deg);
        opacity: 0;
      }
      20% { opacity: 0.6; }
      80% { opacity: 0.6; }
      100% {
        transform: translateY(-10vh) rotate(360deg);
        opacity: 0;
      }
    }

    /* Envelope Button Trigger */
    .envelope-trigger {
      position: absolute;
      bottom: 40px;
      z-index: 5;
      cursor: pointer;
      background: rgba(255, 255, 255, 0.1);
      backdrop-filter: blur(10px);
      padding: 12px 24px;
      border-radius: 30px;
      border: 1px solid rgba(255, 255, 255, 0.2);
      color: #ff8fa3;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 10px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.3);
      transition: all 0.3s ease;
    }

    .envelope-trigger:hover {
      background: rgba(255, 255, 255, 0.2);
      transform: translateY(-3px);
      box-shadow: 0 15px 35px rgba(255, 101, 132, 0.3);
    }

    /* ----------------------------------------------------
       LETTER OVERLAY & ENVELOPE ANIMATION
    ---------------------------------------------------- */
    #letter-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(13, 6, 20, 0.85);
      backdrop-filter: blur(8px);
      z-index: 20;
      display: flex;
      justify-content: center;
      align-items: center;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.5s ease;
    }

    #letter-overlay.visible {
      opacity: 1;
      pointer-events: auto;
    }

    .envelope-wrapper {
      position: relative;
      width: 320px;
      height: 220px;
      background: #ff4b2b;
      border-radius: 0 0 10px 10px;
      box-shadow: 0 25px 50px rgba(0,0,0,0.5);
    }

    .envelope-flap {
      position: absolute;
      top: 0;
      left: 0;
      width: 0;
      height: 0;
      border-left: 160px solid transparent;
      border-right: 160px solid transparent;
      border-top: 120px solid #ff6584;
      transform-origin: top;
      z-index: 3;
    }

    .letter-paper {
      position: absolute;
      bottom: 10px;
      left: 15px;
      width: 290px;
      height: 380px;
      background: #fff;
      color: #333;
      padding: 30px 25px;
      border-radius: 8px;
      box-shadow: 0 5px 15px rgba(0,0,0,0.1);
      z-index: 2;
      transform: translateY(0);
      overflow: hidden;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .letter-paper h2 {
      font-family: 'Dancing Script', cursive;
      color: #ff416c;
      font-size: 2.2rem;
      margin-bottom: 10px;
    }

    .letter-paper p {
      font-size: 0.95rem;
      line-height: 1.6;
      color: #555;
      font-family: 'Poppins', sans-serif;
    }

    .letter-signature {
      font-family: 'Dancing Script', cursive;
      font-size: 1.6rem;
      color: #ff416c;
      text-align: right;
      margin-top: 15px;
      opacity: 0;
    }

    .close-btn {
      position: absolute;
      top: 20px;
      right: 20px;
      background: transparent;
      border: none;
      color: white;
      font-size: 2rem;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <!-- Audio Element -->
  <audio id="bg-music" loop src="https://cdn.pixabay.com/download/audio/2022/05/27/audio_1808fbf07a.mp3?filename=romantic-love-112188.mp3"></audio>

  <!-- QUESTION SCREEN -->
  <div id="question-screen" class="screen">
    <div class="card">
      <h1>Hi Hon...</h1>
      <p>Mahal moko? Upaya la🙄</p>
      <div class="button-group">
        <button id="yes-btn" class="btn btn-yes">Yes, I'd love to!</button>
        <button id="no-btn" class="btn btn-no">No</button>
      </div>
    </div>
  </div>

  <!-- 3D CLIMAX SCREEN -->
  <div id="climax-screen" class="screen">
    <canvas id="canvas-3d"></canvas>
    
    <!-- Ambient HTML Floating Elements -->
    <div id="html-particles-container"></div>

    <div id="open-envelope-btn" class="envelope-trigger">
      <span>✉️</span> Kindly click hon
    </div>
  </div>

  <!-- LETTER OVERLAY -->
  <div id="letter-overlay">
    <button id="close-letter" class="close-btn">&times;</button>
    <div class="envelope-wrapper">
      <div id="flap" class="envelope-flap"></div>
      <div id="letter" class="letter-paper">
        <div>
          <h2>To Hon,</h2>
          <p id="typed-text"></p>
        </div>
        <div id="signature" class="letter-signature">From, Shane ❤️</div>
      </div>
    </div>
  </div>

  <script>
    /* ====================================================
       1. STATE & GLOBAL VARIABLES
    ==================================================== */
    const yesBtn = document.getElementById('yes-btn');
    const noBtn = document.getElementById('no-btn');
    const questionScreen = document.getElementById('question-screen');
    const climaxScreen = document.getElementById('climax-screen');
    const bgMusic = document.getElementById('bg-music');
    const canvas = document.getElementById('canvas-3d');
    const ctx = canvas.getContext('2d');

    let width = canvas.width = window.innerWidth;
    let height = canvas.height = window.innerHeight;

    let particles = [];
    let backgroundStars = [];
    let sparkles = [];
    let animationPhase = 'rain'; // 'rain' -> 'assemble' -> 'beating'
    let phaseProgress = 0;
    let heartbeatScale = 1;

    const lovePhrases = [
      'I Love You', 'Te Amo', 'Je t\'aime', 'Ich liebe dich', 
      'Ti amo', 'Eu te amo', 'Aishiteru', 'Saranghae', 
      'Forever', 'My Love', 'Always', 'You & Me'
    ];

    /* ====================================================
       2. ESCAPING "NO" BUTTON LOGIC
    ==================================================== */
    function moveNoButton() {
      const card = document.querySelector('.card');
      const cardRect = card.getBoundingClientRect();
      const btnRect = noBtn.getBoundingClientRect();

      // Calculate max bounds within the card
      const maxX = cardRect.width - btnRect.width - 20;
      const maxY = cardRect.height - btnRect.height - 20;

      const randomX = Math.random() * maxX - (cardRect.width / 2 - btnRect.width);
      const randomY = Math.random() * maxY - (cardRect.height / 2 - btnRect.height);

      gsap.to(noBtn, {
        x: randomX,
        y: randomY,
        duration: 0.2,
        ease: 'power2.out'
      });
    }

    noBtn.addEventListener('mouseenter', moveNoButton);
    noBtn.addEventListener('touchstart', (e) => {
      e.preventDefault();
      moveNoButton();
    });

    /* ====================================================
       3. TRANSITION TO 3D CLIMAX
    ==================================================== */
    yesBtn.addEventListener('click', () => {
      // Play Audio
      bgMusic.play().catch(() => console.log('Audio autoplay restricted'));

      // Fade Out Question Screen
      gsap.to(questionScreen, {
        opacity: 0,
        duration: 1,
        onComplete: () => {
          questionScreen.style.display = 'none';
          show3DClimax();
        }
      });
    });

    function show3DClimax() {
      climaxScreen.classList.add('active');
      init3DScene();
      spawnHTMLParticles();

      // Timeline sequence for animation phases
      // Rain for 2.5s -> Assemble over 3s -> Start beating
      setTimeout(() => {
        animationPhase = 'assemble';
        gsap.to(window, {
          phaseProgress: 1,
          duration: 3,
          ease: 'power2.inOut',
          onComplete: () => {
            animationPhase = 'beating';
            startHeartbeatAnimation();
          }
        });
      }, 2500);
    }

    /* ====================================================
       4. 3D CANVAS & PARTICLE ENGINE
    ==================================================== */
    class BackgroundStar {
      constructor() {
        this.x = (Math.random() - 0.5) * width * 2;
        this.y = (Math.random() - 0.5) * height * 2;
        this.z = Math.random() * 1000 + 100;
        this.size = Math.random() * 2 + 0.5;
        this.alpha = Math.random();
        this.speed = Math.random() * 0.02 + 0.005;
      }

      update() {
        this.alpha += this.speed;
        if (this.alpha > 1 || this.alpha < 0) this.speed = -this.speed;
      }

      draw(fov, cx, cy) {
        const scale = fov / (fov + this.z);
        const x2d = this.x * scale + cx;
        const y2d = this.y * scale + cy;

        ctx.fillStyle = `rgba(255, 182, 193, ${Math.abs(this.alpha) * 0.6})`;
        ctx.beginPath();
        ctx.arc(x2d, y2d, this.size * scale, 0, Math.PI * 2);
        ctx.fill();
      }
    }

    class Particle3D {
      constructor(text, target3D) {
        this.text = text;
        
        // Initial 3D Position (Rain phase - dispersed high above)
        this.x = (Math.random() - 0.5) * width * 1.5;
        this.y = -Math.random() * height - 200;
        this.z = (Math.random() - 0.5) * 600;

        this.velocityY = Math.random() * 4 + 2;

        // Target Heart 3D Position
        this.targetX = target3D.x;
        this.targetY = target3D.y;
        this.targetZ = target3D.z;

        // Start position storage for interpolation
        this.startX = this.x;
        this.startY = this.y;
        this.startZ = this.z;

        this.color = `hsl(${Math.random() * 30 + 340}, 100%, 70%)`;
        this.fontSize = Math.floor(Math.random() * 6) + 10;
      }

      update() {
        if (animationPhase === 'rain') {
          this.y += this.velocityY;
          if (this.y > height / 2 + 400) {
            this.y = -height / 2 - 200;
          }
          this.startX = this.x;
          this.startY = this.y;
          this.startZ = this.z;
        } else if (animationPhase === 'assemble') {
          // Lerp towards Heart Target
          const ease = easeInOutCubic(phaseProgress);
          this.x = this.startX + (this.targetX - this.startX) * ease;
          this.y = this.startY + (this.targetY - this.startY) * ease;
          this.z = this.startZ + (this.targetZ - this.startZ) * ease;
        }
      }

      draw(fov, cx, cy, rotY) {
        // Apply Y-axis Rotation for 3D Heart rotation
        let rx = this.x;
        let ry = this.y;
        let rz = this.z;

        if (animationPhase === 'beating' || animationPhase === 'assemble') {
          // Apply heartbeat scale
          rx *= heartbeatScale;
          ry *= heartbeatScale;
          rz *= heartbeatScale;

          // Rotate around Y axis
          const cos = Math.cos(rotY);
          const sin = Math.sin(rotY);
          const xRot = rx * cos - rz * sin;
          const zRot = rx * sin + rz * cos;
          rx = xRot;
          rz = zRot;
        }

        // 3D Perspective Projection
        const scale = fov / (fov + rz + 400);
        const x2d = rx * scale + cx;
        const y2d = ry * scale + cy;

        if (scale > 0) {
          ctx.font = `600 ${this.fontSize * scale}px Poppins`;
          ctx.fillStyle = this.color;
          ctx.globalAlpha = Math.min(Math.max((rz + 300) / 600, 0.2), 1);
          ctx.fillText(this.text, x2d, y2d);
          ctx.globalAlpha = 1.0;
        }
      }
    }

    class Sparkle {
      constructor(x, y, z) {
        this.x = x;
        this.y = y;
        this.z = z;
        this.size = Math.random() * 3 + 1;
        this.alpha = 1;
        this.vx = (Math.random() - 0.5) * 2;
        this.vy = (Math.random() - 0.5) * 2;
        this.vz = (Math.random() - 0.5) * 2;
      }
      update() {
        this.x += this.vx;
        this.y += this.vy;
        this.z += this.vz;
        this.alpha -= 0.02;
      }
      draw(fov, cx, cy) {
        const scale = fov / (fov + this.z + 400);
        ctx.fillStyle = `rgba(255, 255, 255, ${Math.max(this.alpha, 0)})`;
        ctx.beginPath();
        ctx.arc(this.x * scale + cx, this.y * scale + cy, this.size * scale, 0, Math.PI * 2);
        ctx.fill();
      }
    }

    // Parametric Heart 3D Formula
    function getHeart3DPosition(t, u) {
      // t: 0 to PI*2, u: -1 to 1
      const x = 16 * Math.pow(Math.sin(t), 3);
      const y = -(13 * Math.cos(t) - 5 * Math.cos(2*t) - 2 * Math.cos(3*t) - Math.cos(4*t));
      const z = u * 6; // Thickness

      const scale = 12;
      return { x: x * scale, y: y * scale, z: z * scale };
    }

    function init3DScene() {
      particles = [];
      backgroundStars = [];

      // Create Background Stars
      for (let i = 0; i < 150; i++) {
        backgroundStars.push(new BackgroundStar());
      }

      // Create 3D Heart Particles
      const totalParticles = 220;
      for (let i = 0; i < totalParticles; i++) {
        const t = Math.PI * 2 * (i / totalParticles);
        const u = (Math.random() - 0.5) * 2;
        const target3D = getHeart3DPosition(t, u);
        const phrase = lovePhrases[i % lovePhrases.length];
        particles.push(new Particle3D(phrase, target3D));
      }

      requestAnimationFrame(render3D);
    }

    let rotationAngle = 0;
    function render3D() {
      ctx.clearRect(0, 0, width, height);

      const fov = 400;
      const cx = width / 2;
      const cy = height / 2 - 20;

      // Draw Background Stars
      backgroundStars.forEach(star => {
        star.update();
        star.draw(fov, cx, cy);
      });

      // Heart Rotation Speed
      if (animationPhase === 'beating') {
        rotationAngle += 0.008;
      } else if (animationPhase === 'assemble') {
        rotationAngle += 0.004;
      }

      // Sort Particles by Z (Depth Sorting for rendering)
      particles.forEach(p => p.update());
      particles.sort((a, b) => b.z - a.z);

      // Render Particles
      particles.forEach(p => p.draw(fov, cx, cy, rotationAngle));

      // Render & Update Sparkles
      for (let i = sparkles.length - 1; i >= 0; i--) {
        sparkles[i].update();
        sparkles[i].draw(fov, cx, cy);
        if (sparkles[i].alpha <= 0) sparkles.splice(i, 1);
      }

      requestAnimationFrame(render3D);
    }

    function startHeartbeatAnimation() {
      const heartbeatTL = gsap.timeline({ repeat: -1 });
      heartbeatTL
        .to(window, {
          heartbeatScale: 1.18,
          duration: 0.15,
          ease: 'power1.out',
          onStart: emitSparkles
        })
        .to(window, { heartbeatScale: 1.0, duration: 0.15, ease: 'power1.in' })
        .to(window, {
          heartbeatScale: 1.08,
          duration: 0.12,
          ease: 'power1.out',
          onStart: emitSparkles
        })
        .to(window, { heartbeatScale: 1.0, duration: 0.4, ease: 'power2.inOut' })
        .to(window, { duration: 0.3 }); // Pause between beats
    }

    function emitSparkles() {
      for (let i = 0; i < 15; i++) {
        const p = particles[Math.floor(Math.random() * particles.length)];
        sparkles.push(new Sparkle(p.x, p.y, p.z));
      }
    }

    function easeInOutCubic(x) {
      return x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2;
    }

    /* ====================================================
       5. AMBIENT HTML FLOATING ELEMENTS
    ==================================================== */
    function spawnHTMLParticles() {
      const container = document.getElementById('html-particles-container');
      const symbols = ['❤️', '💖', '✨', '🌸', '💕'];

      setInterval(() => {
        if (document.hidden) return;
        const el = document.createElement('div');
        el.className = 'html-particle';
        el.innerText = symbols[Math.floor(Math.random() * symbols.length)];
        el.style.left = Math.random() * 100 + 'vw';
        el.style.fontSize = (Math.random() * 20 + 12) + 'px';
        el.style.animationDuration = (Math.random() * 4 + 6) + 's';
        
        container.appendChild(el);
        setTimeout(() => el.remove(), 10000);
      }, 600);
    }

    /* ====================================================
       6. LETTER OVERLAY & TYPEWRITER EFFECT
    ==================================================== */
    const openEnvelopeBtn = document.getElementById('open-envelope-btn');
    const letterOverlay = document.getElementById('letter-overlay');
    const closeLetterBtn = document.getElementById('close-letter');
    const flap = document.getElementById('flap');
    const letter = document.getElementById('letter');
    const typedTextEl = document.getElementById('typed-text');
    const signatureEl = document.getElementById('signature');

    const loveLetterMessage = "Happy Birthday Hon. It tooks me days to made this website for you haha. Uhm I want you to be the happiest man alive so keep dreaming on and focus on your goals, Andito lang po ako palagi hon. Thank you for being my frienenemy, and my favorite person. I love you mwa😘";

    let isTyping = false;

    openEnvelopeBtn.addEventListener('click', () => {
      letterOverlay.classList.add('visible');
      
      // Animate Envelope Open
      gsap.timeline()
        .to(flap, { rotateX: 180, duration: 0.6, ease: 'power2.inOut' })
        .to(letter, { y: -160, zIndex: 5, duration: 0.8, ease: 'back.out(1.2)' }, '-=0.2')
        .add(() => {
          if (!isTyping) startTypingLetter();
          triggerConfetti();
        });
    });

    closeLetterBtn.addEventListener('click', closeLetterOverlay);

    function closeLetterOverlay() {
      gsap.timeline()
        .to(letter, { y: 0, zIndex: 2, duration: 0.5 })
        .to(flap, { rotateX: 0, duration: 0.4 }, '-=0.2')
        .add(() => {
          letterOverlay.classList.remove('visible');
        });
    }

    function startTypingLetter() {
      isTyping = true;
      typedTextEl.innerHTML = '';
      signatureEl.style.opacity = '0';
      
      let index = 0;
      function typeChar() {
        if (index < loveLetterMessage.length) {
          typedTextEl.innerHTML += loveLetterMessage.charAt(index);
          index++;
          setTimeout(typeChar, 35);
        } else {
          gsap.to(signatureEl, { opacity: 1, duration: 1 });
        }
      }
      typeChar();
    }

    /* ====================================================
       7. CELEBRATION CONFETTI
    ==================================================== */
    function triggerConfetti() {
      const count = 200;
      const defaults = { origin: { y: 0.7 } };

      function fire(particleRatio, opts) {
        confetti(Object.assign({}, defaults, opts, {
          particleCount: Math.floor(count * particleRatio)
        }));
      }

      fire(0.25, { spread: 26, startVelocity: 55, colors: ['#ff416c', '#ff4b2b'] });
      fire(0.2, { spread: 60, colors: ['#ffffff', '#ff8fa3'] });
      fire(0.35, { spread: 100, decay: 0.91, scalar: 0.8 });
      fire(0.1, { spread: 120, startVelocity: 25, decay: 0.92, scalar: 1.2 });
      fire(0.1, { spread: 120, startVelocity: 45 });
    }

    /* ====================================================
       8. WINDOW RESIZE HANDLER
    ==================================================== */
    window.addEventListener('resize', () => {
      width = canvas.width = window.innerWidth;
      height = canvas.height = window.innerHeight;
    });
  </script>
</body>
</html>
